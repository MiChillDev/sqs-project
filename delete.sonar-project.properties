# SonarCloud Configuration

sonar.organization=michilldev
sonar.projectKey=MiChillDev_sqs-project

sonar.projectName=SQS Project
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.test.inclusions=**/*Test.java,**/*Tests.java
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Test directories
sonar.tests=backend/src/test/java

# Java Backend
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript Frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=\
  **/ChuckNorrisApplication.java,\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  frontend/src/shared/api/generated/**

# General exclusions
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/*.sql,\
  **/db/migration/**,\
  frontend/src/shared/api/generated/**,\
  frontend/src/**/__tests__/**

# Java test patterns
sonar.test.inclusions=\
  **/*Test.java,\
  **/*Tests.java