name: Bash Tests Pipeline

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'start-application.sh'
      - 'stop-application.sh'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'test/bash/**'
      - 'test/integration/**'

jobs:
  test-bash:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Bats
          run: sudo npm install -g bats

      - name: Run Bats tests
        run: bats test/bash/

  test-integration:
    needs: [test-bash]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make scripts executable
        run: chmod +x start-application.sh stop-application.sh test/integration/test-auth-security-flow.sh

      - name: Run integration tests
        run: ./test/integration/test-auth-security-flow.sh

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down --remove-orphans
