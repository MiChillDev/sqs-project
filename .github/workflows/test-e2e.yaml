name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'test/e2e/**'
      - 'api/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.16.0 --activate

      - name: Install e2e dependencies
        working-directory: test/e2e
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: test/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Start application stack
        run: docker compose --profile prod up -d --build --wait postgres app frontend
        env:
          SPRING_PROFILES_ACTIVE: mock-external-api

      - name: Wait for frontend
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: Generate API types and verify
        working-directory: test/e2e
        run: |
          npx openapi-typescript ../../api/openapi.yaml -o ../../api/generated/api-types.ts
          git diff --exit-code ../../api/generated/api-types.ts

      - name: Type-check
        working-directory: test/e2e
        run: pnpm typecheck

      - name: Seed database
        working-directory: test/e2e
        run: pnpm seed
        env:
          SEED_ADMIN_USERNAME: ${{ secrets.E2E_SEED_ADMIN_USERNAME }}
          SEED_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_ADMIN_PASSWORD }}

      - name: Run E2E tests
        working-directory: test/e2e
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

      - name: Stop application stack
        if: always()
        run: docker compose down
