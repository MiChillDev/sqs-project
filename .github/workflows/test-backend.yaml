name: Backend CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java
        uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile backend
        run: cd backend && mvn clean compile

      - name: Run unit tests with coverage
        run: cd backend && mvn verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Upload coverage XML for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 7

