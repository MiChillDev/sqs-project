name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonarcloud:
    name: SonarCloud Full Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # BACKEND (Java + JaCoCo)
      # =========================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend + run tests (JaCoCo)
        run: cd backend && mvn clean verify

      # =========================
      # FRONTEND (Vitest + LCOV)
      # =========================
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Run frontend tests with coverage
        run: cd frontend && pnpm test -- --coverage

      # =========================
      # SONARCLOUD ANALYSIS
      # =========================
      - name: SonarCloud Scan
        run: >
          cd backend &&
          mvn sonar:sonar
          -Dsonar.projectKey=MiChillDev_sqs-project
          -Dsonar.organization=michilldev
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.javascript.lcov.reportPaths=../frontend/coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # =========================
      # QUALITY GATE
      # =========================
      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}