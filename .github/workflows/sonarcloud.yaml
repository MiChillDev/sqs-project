name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonarcloud:
    name: SonarCloud Full Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend + run tests (no verify gate)
        working-directory: backend
        run: mvn clean test jacoco:report

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: pnpm test -- --coverage

      - name: Check frontend coverage output
        working-directory: frontend
        run: |
          pwd
          find coverage -maxdepth 2 -type f | sort

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=michilldev
            -Dsonar.projectKey=MiChillDev_sqs-project
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=backend/src/main/java,frontend/src
            -Dsonar.tests=backend/src/test/java
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.java.test.binaries=backend/target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/ChuckNorrisApplication.java
            -Dsonar.test.inclusions=**/*Test.java,**/*Tests.java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300