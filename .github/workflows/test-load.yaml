name: Backend Load Test Pipeline

on:
  workflow_call:
    inputs:
      run-spike:
        type: boolean
        default: false

jobs:
  k6-load-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Make scripts executable
        run: |
          chmod +x start-application.sh
          chmod +x stop-application.sh
          chmod +x test/load/run-loadtest.sh

      - name: Start backend services
        run: ./start-application.sh --backend-only --yes

      - name: Run baseline test
        run: ./test/load/run-loadtest.sh tests/baseline-test.js

      - name: Run stress test
        run: ./test/load/run-loadtest.sh tests/stress-test.js

      - name: Run spike test
        if: inputs.run-spike
        run: ./test/load/run-loadtest.sh tests/spike-test.js

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color postgres || true
          docker compose logs --no-color app || true

      - name: Stop services
        if: always()
        run: ./stop-application.sh --reset --yes
