services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sqs_db}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - source: postgres_password
        target: postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - sqs-network

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sqs_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: app_seed_admin_username
        target: app.seed.admin.username
      - source: app_seed_admin_password
        target: app.seed.admin.password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sqs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    user: "1000:1000"
    environment:
      K6_BASE_URL: http://app:8080/api/v1
    volumes:
      - ./test/load:/scripts
    working_dir: /scripts
    entrypoint: ["k6"]
    secrets:
      - source: app_seed_admin_username
        target: app.seed.admin.username
      - source: app_seed_admin_password
        target: app.seed.admin.password
    networks:
      - sqs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    profiles: ["prod"]
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sqs-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["corepack", "pnpm", "dev", "--host", "0.0.0.0"]
    environment:
      API_TARGET: http://app:8080
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sqs-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  app_seed_admin_username:
    file: ./.secrets/app_seed_admin_username
  app_seed_admin_password:
    file: ./.secrets/app_seed_admin_password

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  sqs-network:
    driver: bridge