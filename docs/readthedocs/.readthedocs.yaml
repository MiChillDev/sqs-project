# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"
  apt_packages:
    - graphviz
    - unzip
    - openjdk-17-jre-headless
  jobs:
    pre_build:
     - curl -fsSL -o /tmp/plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
      - java -jar /tmp/plantuml.jar -tsvg docs/readthedocs/arc42/diagrams/backend-code.puml
      - java -jar /tmp/plantuml.jar -tsvg docs/readthedocs/arc42/diagrams/database-schema.puml
      - ls -la docs/readthedocs/arc42/diagrams
      - test -f docs/readthedocs/arc42/diagrams/backend-code.svg
      - test -f docs/readthedocs/arc42/diagrams/database-schema.svg
      - curl -fsSL -o /tmp/structurizr-cli.zip https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip
      - unzip -q /tmp/structurizr-cli.zip -d /tmp/structurizr-cli
      - chmod +x /tmp/structurizr-cli/structurizr.sh
      - /tmp/structurizr-cli/structurizr.sh validate -workspace docs/readthedocs/arc42/diagrams/c4_diagram.dsl
      - rm -rf docs/readthedocs/structurizr
      - mkdir -p docs/readthedocs/structurizr
      - /tmp/structurizr-cli/structurizr.sh export -workspace docs/readthedocs/arc42/diagrams/c4_diagram.dsl -format static -output docs/readthedocs/structurizr
      - find docs/readthedocs/structurizr -maxdepth 2 -type f | sort | head -50
      ## Create UML and ER diagrams for C4
      #- curl -L -o /tmp/plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
      #- java -jar /tmp/plantuml.jar -tsvg docs/readthedocs/arc42/diagrams/backend-code.puml
      #- java -jar /tmp/plantuml.jar -tsvg docs/readthedocs/arc42/diagrams/database-schema.puml
      ## Create interactive C4 diagrams
      #- curl -L -o /tmp/structurizr-cli.zip https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip
      #- unzip -q /tmp/structurizr-cli.zip -d /tmp/structurizr-cli
      #- chmod +x /tmp/structurizr-cli/structurizr.sh
      #- /tmp/structurizr-cli/structurizr.sh export -workspace docs/readthedocs/arc42/diagrams/c4_diagram.dsl -format static -output docs/readthedocs/structurizr

mkdocs:
  configuration: docs/readthedocs/.mkdocs.yaml

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: docs/readthedocs/requirements.txt
